worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format privacy '$remote_addr - $host "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent rt=$request_time request_id=$request_id';
    access_log /dev/stdout privacy;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    reset_timedout_connection on;
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/cloudflare-real-ip.conf;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_bot:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api_export:10m rate=1r/m;
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=export_connections:10m;

    include /etc/nginx/conf.d/*.conf;
}
