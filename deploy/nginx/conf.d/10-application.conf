server {
    listen 8080;
    server_name localhost;
    access_log off;

    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

server {
    listen 8443 ssl default_server;
    server_name _;
    include /etc/nginx/snippets/origin-tls.conf;
    return 421;
}

server {
    listen 8443 ssl;
    server_name deetnuts.com;
    include /etc/nginx/snippets/origin-tls.conf;
    return 308 https://www.deetnuts.com$request_uri;
}

server {
    listen 8443 ssl;
    server_name www.deetnuts.com;
    include /etc/nginx/snippets/origin-tls.conf;

    location = /login {
        limit_req zone=auth_login burst=10 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /api/bot/discord/interactions {
        limit_req zone=api_bot burst=40 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /auth/ {
        limit_req zone=api_general burst=20 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /api/mht-cet/state-cutoffs/export {
        limit_req zone=api_export burst=5 nodelay;
        limit_conn export_connections 2;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /api/bot/ {
        limit_req zone=api_bot burst=40 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /api/ {
        limit_req zone=api_general burst=100 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 8443 ssl;
    server_name api.deetnuts.com;
    include /etc/nginx/snippets/api-origin-tls.conf;

    client_max_body_size 64m;
    client_body_timeout 120s;

    location = /__cloudflare_access_verify {
        internal;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header X-Access-JWT $http_cf_access_jwt_assertion;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
        proxy_pass http://access_verifier/verify;
    }

    location / {
        auth_request /__cloudflare_access_verify;
        limit_req zone=pocketbase_admin burst=100 nodelay;
        include /etc/nginx/snippets/pocketbase-proxy.conf;
    }
}
