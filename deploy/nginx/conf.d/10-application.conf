server {
    listen 8080;
    server_name localhost;
    access_log off;

    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

server {
    listen 8443 ssl default_server;
    server_name _;
    include /etc/nginx/snippets/origin-tls.conf;
    return 421;
}

server {
    listen 8443 ssl;
    server_name deetnuts.com;
    include /etc/nginx/snippets/origin-tls.conf;
    return 308 https://www.deetnuts.com$request_uri;
}

server {
    listen 8443 ssl;
    server_name www.deetnuts.com;
    include /etc/nginx/snippets/origin-tls.conf;

    location = /login {
        limit_req zone=auth_login burst=10 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /api/bot/discord/interactions {
        limit_req zone=api_bot burst=40 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /auth/ {
        limit_req zone=api_general burst=20 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /api/mht-cet/state-cutoffs/export {
        limit_req zone=api_export burst=5 nodelay;
        limit_conn export_connections 2;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /api/bot/ {
        limit_req zone=api_bot burst=40 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /api/ {
        limit_req zone=api_general burst=100 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
    }
}
