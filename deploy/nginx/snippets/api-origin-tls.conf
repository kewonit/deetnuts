ssl_certificate /etc/nginx/certs/api-origin.pem;
ssl_certificate_key /etc/nginx/certs/api-origin-key.pem;
ssl_client_certificate /etc/nginx/certs/cloudflare-api-origin-pull-ca.pem;
ssl_verify_client on;
ssl_verify_depth 2;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:API_SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
